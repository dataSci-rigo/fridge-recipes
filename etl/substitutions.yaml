# Curated 1:1 ingredient substitution pairs (genuinely different ingredients
# that work as swaps in most recipes) -- distinct from etl/aliases.yaml,
# which collapses "the same ingredient, different name" at canonicalization
# time. Each entry is [a, b]; substitution is undirected (a<->b).
# Grows over time from recipe ingestion ("butter, or margarine") and the
# live Claude fallback in core/substitutions.py -- this is just the seed.
