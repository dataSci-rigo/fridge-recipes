<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Fridge Recipes{% endblock %}</title>
<style>
/* Mirrors food/web.py's _STYLE palette for fleet consistency */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#fff; --surface:#f5f5f5; --border:#e0e0e0;
  --text:#212121; --muted:#757575; --accent:#27ae60;
  --danger:#e74c3c; --warn:#f39c12;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#121212; --surface:#1e1e1e; --border:#333;
    --text:#e0e0e0; --muted:#9e9e9e; --accent:#4caf50;
    --danger:#f44336; --warn:#ff9800;
  }
}
body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text);
       max-width:900px; margin:0 auto; padding:16px; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
h1 { font-size:1.4em; margin-bottom:6px; }
h2 { font-size:1.05em; margin:22px 0 10px; color:var(--muted); text-transform:uppercase;
     letter-spacing:.05em; }
.sub { color:var(--muted); font-size:.9em; margin-bottom:18px; }
.topnav { display:flex; gap:14px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
.topnav .brand { font-weight:700; font-size:1.1em; color:var(--text); }
.topnav .demo-badge { background:var(--warn); color:#fff; font-size:.72em;
  padding:2px 8px; border-radius:10px; }

button, .btn {
  padding:7px 14px; border:1px solid var(--border); border-radius:6px;
  background:var(--surface); color:var(--text); font-size:.9em; cursor:pointer;
  display:inline-block;
}
button:hover, .btn:hover { border-color:var(--accent); text-decoration:none; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.danger  { color:var(--danger); }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:14px 0; }

/* Item grid (setup wizard) */
.item-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
             gap:10px; margin:14px 0; }
.item-card { position:relative; }
.item-card input { position:absolute; opacity:0; }
.item-card label { display:flex; flex-direction:column; align-items:center; gap:6px;
  background:var(--surface); border:2px solid var(--border); border-radius:10px;
  padding:10px; cursor:pointer; text-align:center; font-size:.85em; }
.item-card input:checked + label { border-color:var(--accent); }
.item-card input:checked + label::after { content:"✓"; position:absolute; top:6px; right:9px;
  color:var(--accent); font-weight:700; }
.item-card img { width:72px; height:72px; object-fit:cover; border-radius:8px;
  background:var(--border); }
.item-card .loc { color:var(--muted); font-size:.8em; }

/* Recipe result cards */
.card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
             gap:12px; margin:14px 0; }
.recipe-card { background:var(--surface); border:1px solid var(--border);
  border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
.recipe-card img { width:100%; height:130px; object-fit:cover; background:var(--border); }
.recipe-card .body { padding:10px 12px; }
.recipe-card .title { font-weight:600; font-size:.92em; }
.recipe-card .meta { color:var(--muted); font-size:.8em; margin-top:4px; }

/* Recipe detail */
.hero-img { width:100%; max-height:320px; object-fit:cover; border-radius:12px; margin:12px 0; }
.ing-list { list-style:none; margin:10px 0; }
.ing-list li { display:flex; align-items:center; gap:10px; padding:6px 4px;
  border-bottom:1px solid var(--border); font-size:.92em; }
.ing-list img { width:40px; height:40px; object-fit:cover; border-radius:6px;
  background:var(--border); }
.ing-list .have-yes { color:var(--accent); }
.ing-list .have-no  { color:var(--danger); }
.directions { white-space:pre-wrap; line-height:1.55; margin:14px 0; }

/* Forms */
.field { display:flex; flex-direction:column; gap:3px; }
.field span { font-size:.75em; color:var(--muted); }
input[type=text], input[type=number], select, textarea {
  padding:6px 9px; border:1px solid var(--border); border-radius:6px;
  background:var(--bg); color:var(--text); font-size:.9em; font-family:inherit;
}
.search-form { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end;
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:14px; margin-bottom:8px; }
textarea { width:100%; min-height:160px; }

/* Autocomplete */
.ac-wrap { position:relative; }
.ac-results { position:absolute; top:100%; left:0; right:0; z-index:20;
  background:var(--bg); border:1px solid var(--border); border-radius:8px;
  max-height:280px; overflow-y:auto; box-shadow:0 4px 14px rgba(0,0,0,.15); }
.ac-results:empty { display:none; }
.ac-item { display:flex; align-items:center; gap:9px; padding:6px 10px; cursor:pointer;
  font-size:.9em; }
.ac-item:hover { background:var(--surface); }
.ac-item img { width:34px; height:34px; object-fit:cover; border-radius:5px;
  background:var(--border); }

/* Browse picture-buttons */
.tile-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
             gap:10px; margin:10px 0 18px; }
.tile { display:flex; flex-direction:column; align-items:center; gap:6px;
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:10px 8px; color:var(--text); font-size:.85em; text-align:center; }
.tile:hover { border-color:var(--accent); text-decoration:none; }
.tile img { width:100%; height:74px; object-fit:cover; border-radius:8px;
  background:var(--border); }
.tile-emoji .emoji { font-size:2.4em; line-height:74px; }

.pager { color:var(--muted); font-size:.9em; }
.review-list { list-style:none; margin:12px 0; }
.review-list li { display:flex; align-items:center; gap:10px; padding:7px 4px;
  border-bottom:1px solid var(--border); }
.review-list img { width:40px; height:40px; object-fit:cover; border-radius:6px;
  background:var(--border); }
.review-list form { margin-left:auto; }
.error { color:var(--danger); margin:10px 0; }
.notice { background:var(--surface); border:1px solid var(--border); border-radius:8px;
  padding:10px 14px; margin:10px 0; font-size:.9em; }
</style>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script>
function acPick(targetId, name) {
  var el = document.getElementById(targetId);
  if (!el) return;
  if (el.dataset.append === "1" && el.value.trim()) {
    var parts = el.value.split(",").map(function(s){return s.trim();}).filter(Boolean);
    if (parts.indexOf(name) === -1) parts.push(name);
    el.value = parts.join(", ");
  } else {
    el.value = name;
  }
  var box = document.getElementById(targetId + "-ac");
  if (box) box.innerHTML = "";
  el.focus();
}
</script>
</head>
<body>
<nav class="topnav">
  <a class="brand" href="{{ prefix }}/search">🧊 Fridge Recipes</a>
  {% if mode == "demo" %}<span class="demo-badge">DEMO</span>{% endif %}
  <a href="{{ prefix }}/search">Search</a>
  <a href="{{ prefix }}/review">My fridge</a>
  <a href="{{ prefix }}/add">Add your own</a>
  <a href="{{ prefix }}/setup">Setup</a>
</nav>
{% block content %}{% endblock %}
</body>
</html>
